      <rect x="393" y="389" width="75" height="47" rx="10"/><rect x="478" y="389" width="75" height="47" rx="10"/><rect x="563" y="389" width="75" height="47" rx="10"/><rect x="648" y="389" width="75" height="47" rx="10"/><rect x="733" y="389" width="74" height="47" rx="10"/>
