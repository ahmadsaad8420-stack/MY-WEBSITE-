<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title">
  <title id="title">Scientific calculator preview</title>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#081326"/><stop offset="1" stop-color="#183c70"/></linearGradient>
    <linearGradient id="screen" x2="0" y2="1"><stop stop-color="#152a46"/><stop offset="1" stop-color="#0e1e35"/></linearGradient>
    <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#49a5ff"/><stop offset="1" stop-color="#2469e9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#020913" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="560" fill="url(#background)"/>
